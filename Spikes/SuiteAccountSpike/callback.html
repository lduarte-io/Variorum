<!DOCTYPE html>
<!-- 14a spike — callback: PKCE code exchange + THE VAULT-ACCESS PROBE
     (THROWAWAY). Receives ?code= from the neutral project's OAuth server,
     exchanges it with the localStorage verifier (public client — no secret),
     decodes the resulting token's claims, and probes the SAME project's
     PostgREST with it (insert + select on the RLS'd vault_probe table).
     This answers P-ii — the unknown flagged since 9c: is an OAuth-server-
     issued access token an ordinary authenticated user JWT to PostgREST?
     Renders a REDACTED summary; raw tokens never leave the page. -->
<html>
<head>
<meta charset="utf-8">
<title>Suite-account spike — callback + vault probe</title>
<style>
  body { font: 14px/1.5 -apple-system, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
  pre { background: #f4f4f4; padding: 10px; overflow-x: auto; white-space: pre-wrap; }
  button { font: inherit; padding: 6px 18px; cursor: pointer; }
  .err { color: #b00; }
  .ok { color: #070; }
</style>
<script src="config.js"></script>
</head>
<body>
<h2>Suite-account spike — callback</h2>
<div id="out"></div>
<button id="probeBtn" style="display:none" onclick="probe()">Run the PostgREST vault probe</button>
<button onclick="copySummary()">Copy redacted summary</button>

<script>
let summary = {};
let accessToken = null;

function decodeJWTPayload(token) {
  try {
    const payload = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(atob(payload));
  } catch (e) { return { decodeError: String(e) }; }
}

function render() {
  document.getElementById("out").innerHTML =
    `<pre>${JSON.stringify(summary, null, 2)}</pre>`;
}

async function exchange(code) {
  const verifier = localStorage.getItem("spike_pkce_verifier");
  if (!verifier) {
    summary = { flow: "code", error: "no PKCE verifier in localStorage — start from start.html" };
    render(); return;
  }
  const body = new URLSearchParams({
    grant_type: "authorization_code",
    code: code,
    redirect_uri: "http://localhost:3000/callback.html",
    client_id: SPIKE_CLIENT_ID,
    code_verifier: verifier,
  });
  const response = await fetch(SUITE_URL + "/auth/v1/oauth/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded",
               "apikey": SUITE_PUBLISHABLE_KEY },
    body: body.toString(),
  });
  const tokens = await response.json().catch(() => ({}));
  if (!response.ok) {
    summary = { flow: "code", exchange: "FAILED",
                status: response.status, body: JSON.stringify(tokens).slice(0, 400) };
    render(); return;
  }
  accessToken = tokens.access_token;
  const claims = decodeJWTPayload(accessToken);
  summary = {
    flow: "pkce-code-exchange", exchange: "ok",
    sub: claims.sub, iss: claims.iss, email: claims.email,
    role: claims.role, aud: claims.aud, amr: claims.amr, exp: claims.exp,
    refresh_token_present: !!tokens.refresh_token,
    id_token_present: !!tokens.id_token,
    token_type: tokens.token_type, expires_in: tokens.expires_in,
  };
  document.getElementById("probeBtn").style.display = "inline-block";
  render();
}

async function probe() {
  // P-ii: the OAuth-issued token against this project's PostgREST + RLS.
  const headers = { "apikey": SUITE_PUBLISHABLE_KEY,
                    "Authorization": "Bearer " + accessToken,
                    "Content-Type": "application/json" };
  const note = "vault-probe " + new Date().toISOString();
  const ins = await fetch(SUITE_URL + "/rest/v1/vault_probe", {
    method: "POST", headers: Object.assign({ "Prefer": "return=representation" }, headers),
    body: JSON.stringify({ note }),
  });
  const insBody = await ins.json().catch(() => ({}));
  const sel = await fetch(SUITE_URL + "/rest/v1/vault_probe?select=id,owner_id,note", { headers });
  const selBody = await sel.json().catch(() => ({}));
  // The negative arm: the bare key alone must be refused.
  const bare = await fetch(SUITE_URL + "/rest/v1/vault_probe?select=id",
    { headers: { "apikey": SUITE_PUBLISHABLE_KEY } });
  const bareBody = await bare.json().catch(() => ({}));
  summary.vault_probe = {
    insert_status: ins.status,
    insert_owner_id: Array.isArray(insBody) && insBody[0] && insBody[0].owner_id,
    select_status: sel.status,
    select_rows: Array.isArray(selBody) ? selBody.length : JSON.stringify(selBody).slice(0, 200),
    bare_key_status: bare.status,
    bare_key_rows: Array.isArray(bareBody) ? bareBody.length : JSON.stringify(bareBody).slice(0, 200),
  };
  summary.vault_probe.verdict =
    (ins.status === 201 && sel.status === 200 &&
     Array.isArray(selBody) && selBody.length > 0 &&
     (bare.status !== 200 || (Array.isArray(bareBody) && bareBody.length === 0)))
      ? "P-ii VERIFIED: OAuth-issued token IS an authenticated PostgREST user; bare key refused/empty"
      : "P-ii NOT CLEAN — record verbatim and stop";
  render();
}

const query = new URLSearchParams(location.search);
const frag = new URLSearchParams(location.hash.replace(/^#/, ""));
if (query.get("code")) {
  const state = localStorage.getItem("spike_state");
  if (state && query.get("state") && state !== query.get("state")) {
    summary = { flow: "code", error: "state mismatch — abandon this run" };
    render();
  } else {
    exchange(query.get("code"));
  }
} else if (frag.get("access_token")) {
  // Implicit-fragment arm (not expected in this spike; kept for completeness).
  const claims = decodeJWTPayload(frag.get("access_token"));
  accessToken = frag.get("access_token");
  summary = { flow: "implicit-fragment", sub: claims.sub, iss: claims.iss,
              role: claims.role, email: claims.email };
  document.getElementById("probeBtn").style.display = "inline-block";
  render();
} else {
  summary = { flow: "error",
              raw: decodeURIComponent(location.search || location.hash).slice(0, 400) };
  render();
}

function copySummary() {
  navigator.clipboard.writeText(JSON.stringify(summary, null, 2));
}
</script>
</body>
</html>
