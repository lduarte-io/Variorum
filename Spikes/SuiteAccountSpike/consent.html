<!DOCTYPE html>
<!-- 14a spike — the NEUTRAL project's login/consent page (THROWAWAY).
     Same flow as 9c's AuthPairingSpike/consent.html (that file's comments
     carry the discovered traps: redirect_url NEVER redirect_uri; the
     auto-approval on the details GET), pointed at the SUITE project — plus a
     CREATE-ACCOUNT door, because the neutral project runs signups ON (the
     non-author provisioning probe). Production replacement: the
     stargazing.tech page, specced for that repo's agent. -->
<html>
<head>
<meta charset="utf-8">
<title>Suite account — authorize (spike)</title>
<style>
  body { font: 14px/1.5 -apple-system, sans-serif; max-width: 520px; margin: 3rem auto; padding: 0 1rem; }
  input, button { font: inherit; padding: 6px 10px; margin: 4px 0; width: 100%; box-sizing: border-box; }
  button { cursor: pointer; width: auto; padding: 6px 18px; }
  pre { background: #f4f4f4; padding: 10px; overflow-x: auto; white-space: pre-wrap; }
  .err { color: #b00; }
  .ok { color: #070; }
</style>
<script src="config.js"></script>
</head>
<body>
<h2>Suite account — authorize <small>(spike consent page)</small></h2>

<div id="status"></div>
<div id="signin" style="display:none">
  <p>Sign in with (or create) a <strong>suite</strong> account:</p>
  <input id="email" type="email" placeholder="email" autocomplete="username">
  <input id="password" type="password" placeholder="password" autocomplete="current-password">
  <button onclick="signIn()">Sign in</button>
  <button onclick="signUp()">Create account</button>
</div>
<div id="consent" style="display:none">
  <p>A client is asking for access:</p>
  <pre id="details"></pre>
  <button onclick="decide('approve')">Approve</button>
  <button onclick="decide('deny')">Deny</button>
</div>

<script>
const qs = new URLSearchParams(location.search);
const authorizationID = qs.get("authorization_id");
let userToken = null;

function show(id) { document.getElementById(id).style.display = "block"; }
function hide(id) { document.getElementById(id).style.display = "none"; }
function status(msg, cls) {
  document.getElementById("status").innerHTML = `<p class="${cls || ""}">${msg}</p>`;
}

async function api(path, options = {}) {
  const headers = Object.assign({
    "apikey": SUITE_PUBLISHABLE_KEY,
    "Content-Type": "application/json",
  }, options.headers || {});
  if (userToken) headers["Authorization"] = "Bearer " + userToken;
  const response = await fetch(SUITE_URL + path, Object.assign({}, options, { headers }));
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(`${response.status} ${JSON.stringify(body)}`);
  return body;
}

function credentials() {
  return {
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
  };
}

async function signIn() {
  try {
    status("Signing in…");
    const session = await api("/auth/v1/token?grant_type=password", {
      method: "POST", body: JSON.stringify(credentials()),
    });
    userToken = session.access_token;
    hide("signin");
    status("Signed in as " + (session.user && session.user.email), "ok");
    await loadAuthorization();
  } catch (e) { status("Sign-in failed: " + e.message, "err"); }
}

async function signUp() {
  try {
    status("Creating account…");
    const result = await api("/auth/v1/signup", {
      method: "POST", body: JSON.stringify(credentials()),
    });
    // With email confirmation off, signup returns a session directly; with it
    // on, the account needs its email confirmed first — either way, report.
    if (result.access_token) {
      userToken = result.access_token;
      hide("signin");
      status("Account created + signed in as " + (result.user && result.user.email), "ok");
      await loadAuthorization();
    } else {
      status("Account created — check the confirmation setting (no session " +
             "returned): " + JSON.stringify(result).slice(0, 300), "ok");
    }
  } catch (e) { status("Signup failed: " + e.message, "err"); }
}

async function loadAuthorization() {
  try {
    const details = await api(`/auth/v1/oauth/authorizations/${authorizationID}`);
    // redirect_url ONLY — the pending shape's redirect_uri is metadata, never
    // a navigation target (the 9c trap, cost a live failure 2026-07-11).
    const target = details.redirect_url;
    if (target) {
      status("Already approved — redirecting back to the client…", "ok");
      location.href = target;
      return;
    }
    document.getElementById("details").textContent = JSON.stringify(details, null, 2);
    show("consent");
  } catch (e) { status("Could not load the authorization: " + e.message, "err"); }
}

async function decide(action) {
  try {
    status("Submitting " + action + "…");
    const result = await api(`/auth/v1/oauth/authorizations/${authorizationID}/consent`, {
      method: "POST", body: JSON.stringify({ action }),
    });
    const target = result.redirect_url;  // never redirect_uri
    if (target) { status("Redirecting back…", "ok"); location.href = target; }
    else { status("No redirect_url in the response: " + JSON.stringify(result), "err"); }
  } catch (e) { status("Consent failed: " + e.message, "err"); }
}

if (!authorizationID) {
  status("Missing ?authorization_id — reach this page via /auth/v1/oauth/authorize " +
         "(use start.html).", "err");
} else if (SUITE_PUBLISHABLE_KEY.startsWith("PASTE-")) {
  status("Fill in config.js first.", "err");
} else {
  show("signin");
}
</script>
</body>
</html>
